map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    listen [::]:443 ssl;
    server_name _;

    # TLS certs are mounted from the host. For Let's Encrypt:
    #   - /etc/nginx/certs/fullchain.pem
    #   - /etc/nginx/certs/privkey.pem
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_prefer_server_ciphers on;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Permissions-Policy "interest-cohort=()" always;
    # CSP — the frontend is on Pages; this is API-only, so only allow self.
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none';" always;

    # Block /metrics from the public — Prometheus must scrape it from inside the bridge net.
    location = /metrics {
        return 404;
    }

    # WebSocket signaling
    location /api/v1/signal/ {
        limit_req zone=cqh_api burst=30 nodelay;
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Trace-Id $http_x_trace_id;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # REST API + healthz / readyz
    location ~ ^/(api/|healthz|readyz) {
        limit_req zone=cqh_api burst=30 nodelay;
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Trace-Id $http_x_trace_id;
    }

    location / {
        return 404;
    }
}
