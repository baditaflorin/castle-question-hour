run:
  timeout: 3m
  tests: true

linters:
  disable-all: true
  enable:
    - errcheck
    - govet
    - staticcheck
    - revive
    - gosec
    - gocyclo
    - misspell
    - unused
    - ineffassign

linters-settings:
  gocyclo:
    min-complexity: 18
  revive:
    rules:
      - name: exported
        disabled: false
      - name: var-naming
      - name: errorf
      - name: package-comments

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - gosec
        - errcheck
